# Runs on GitHub's servers — no computer of yours needs to be on.
# Every 3 hours: scan all sources, commit the new data, redeploy the site to GitHub Pages.
name: Update gadget launches

on:
  schedule:
    - cron: '7 */3 * * *'   # every 3 hours (UTC), at :07 to dodge the top-of-hour queue
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest launches
        env:
          TZ_DISPLAY: Asia/Kolkata   # which timezone decides what "today" means
        run: npm run fetch

      - name: Commit new data
        run: |
          git config user.name "launch-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "data: update $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
